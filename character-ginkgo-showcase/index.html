<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="银杏主题人物独立展示页">
  <title>银杏书页 · 角色立绘试映</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#top" aria-label="返回顶部">
      <span class="brand-mark">研</span>
      <span><strong>角色试映</strong><small>GINKGO ARCHIVE / 06</small></span>
    </a>
    <button class="preview-icon" id="openPreview" type="button" aria-label="查看人物原图" title="查看原图">⛶</button>
  </header>

  <main class="showcase" id="top">
    <div class="color-block color-block-lilac" aria-hidden="true"></div>
    <div class="color-block color-block-butter" aria-hidden="true"></div>
    <div class="guide guide-horizontal" aria-hidden="true"></div>
    <div class="guide guide-vertical" aria-hidden="true"></div>
    <span class="scene-number" aria-hidden="true">06</span>

    <section class="hero-copy" aria-labelledby="page-title">
      <p class="eyebrow"><span></span> GINKGO / QUIET AFTERNOON</p>
      <h1 id="page-title">把秋天，<br><em>留在一页。</em></h1>
      <p class="lede">风经过纸页，也经过金色的叶梢。安静的片刻，正在慢慢落下。</p>
      <div class="tag-row" aria-label="画面关键词">
        <span>GINKGO</span><span>LETTER</span><span>AFTERNOON</span>
      </div>
      <button class="preview-button" id="openPreviewText" type="button">查看完整画面 <span aria-hidden="true">↗</span></button>
    </section>

    <section class="character-scene" aria-label="银杏叶中的金发动漫人物">
      <img class="character-image" src="images/character.jpg" alt="银杏叶环绕的金发动漫人物">
      <div class="scene-note note-one"><small>PAGE</small><strong>06 / AUTUMN</strong></div>
      <div class="scene-note note-two"><small>MEMO</small><strong>STAY GENTLE</strong></div>
    </section>

    <div class="leaf-field" aria-hidden="true"></div>

    <footer class="info-strip">
      <span>GINKGO FIELD STUDY</span>
      <span>CHARACTER ARCHIVE · 2026</span>
    </footer>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-labelledby="previewTitle" hidden>
    <button class="lightbox-backdrop" type="button" data-close aria-label="关闭预览"></button>
    <div class="lightbox-panel">
      <div class="lightbox-head">
        <div><small>ORIGINAL IMAGE</small><h2 id="previewTitle">完整人物画面</h2></div>
        <button class="close-button" type="button" data-close aria-label="关闭预览" title="关闭">×</button>
      </div>
      <div class="preview-frame"><img src="images/character.jpg" alt="银杏主题人物完整原图"></div>
      <p>720 × 739 px</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
