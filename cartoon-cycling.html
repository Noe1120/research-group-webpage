<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e8f0ea">
  <meta name="description" content="一位戴细框眼镜、留蓬松黑发、穿浅灰连帽外套的卡通青年，在公园里骑着珊瑚红自行车。">
  <title>骑个好心情 · 午后骑行</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #e8f0ea;
      --ink: #29443d;
      --muted: #667e70;
      --sky: #d9efe8;
      --leaf: #81ae85;
      --sun: #ffd978;
      --coral: #ed7865;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: var(--paper);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { width: min(1180px, calc(100% - 80px)); padding: 32px 0 25px; }
    .masthead { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin: 0 5px 21px; }
    .identity { display: flex; align-items: center; gap: 13px; }
    .mark { width: 39px; height: 39px; flex: 0 0 auto; }
    h1 { margin: 0; font-family: "YouYuan", "Yuanti SC", "Microsoft YaHei", sans-serif; font-size: 25px; letter-spacing: 3px; font-weight: 700; }
    .subtitle { margin: 5px 0 0; font-family: "Trebuchet MS", sans-serif; color: var(--muted); font-size: 10px; letter-spacing: 3.1px; }
    .weather { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; letter-spacing: 2px; white-space: nowrap; }
    .weather::before { content: ""; width: 7px; height: 7px; background: var(--leaf); border-radius: 50%; }
    .scene { margin: 0; aspect-ratio: 1200 / 760; overflow: hidden; border-radius: 28px; background: var(--sky); position: relative; isolation: isolate; }
    #ride-scene { display: block; width: 100%; height: 100%; }
    .footer { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 18px 5px 0; }
    .caption { margin: 0; color: var(--muted); font-size: 12px; letter-spacing: 1.5px; line-height: 1.8; }
    button { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 44px; padding: 10px 17px; border: 1px solid #b6c9bb; border-radius: 999px; color: var(--ink); background: transparent; font: inherit; font-size: 12px; letter-spacing: 1px; cursor: pointer; transition: background 150ms, border-color 150ms; white-space: nowrap; }
    button:hover { background: #dce9df; border-color: #7f9c87; }
    button:focus-visible { outline: 3px solid var(--coral); outline-offset: 4px; }
    button svg { width: 14px; height: 14px; }
    button[hidden], [hidden] { display: none !important; }
    @media (max-width: 650px) {
      main { width: calc(100% - 28px); padding: 22px 0; }
      .masthead { margin: 0 4px 18px; }
      .identity { gap: 10px; }
      .mark { width: 32px; height: 32px; }
      h1 { font-size: 21px; letter-spacing: 2px; }
      .subtitle { font-size: 8px; letter-spacing: 2.4px; }
      .weather { font-size: 10px; letter-spacing: 1px; gap: 6px; }
      .scene { aspect-ratio: 9 / 10; max-height: 74svh; border-radius: 22px; }
      .footer { padding: 15px 3px 0; gap: 10px; }
      .caption { font-size: 10px; letter-spacing: .5px; }
      button { padding: 10px 12px; font-size: 11px; }
    }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  </style>
</head>

            <path d="M684 288l-1 12 6 1" fill="none" stroke="#bc9070" stroke-width="1.8"/>
            <path d="M670 314Q682 321 695 312" fill="none" stroke="#825e4c" stroke-width="2.5"/>
            <path d="M677 325q6 2 11-1" fill="none" stroke="#d29f7e" stroke-width="1.6"/>
            <path d="M641 265q12-5 23-1M687 263q10-4 18-1" fill="none" stroke="#47433a" stroke-width="3.5"/>
            <g id="eyes" fill="#363e35">
              <ellipse cx="657" cy="282" rx="3.1" ry="4"/><ellipse cx="696" cy="279" rx="2.9" ry="3.7"/>
              <path d="M648 279q8-5 15 0M690 277q7-4 12 0" fill="none" stroke="#45453b" stroke-width="1.7"/>
            </g>
            <g id="glasses" transform="rotate(-3 674 279)" stroke="#454b43" stroke-width="3" fill="#f1f5e8" fill-opacity=".13">
              <path d="M635 267h34l-1 22q-1 7-9 7h-14q-8 0-9-7Z"/>
              <path d="M683 267h29l-1 20q-1 7-7 7h-13q-7 0-7-7Z"/>
              <path d="M669 275q7-5 14 0M634 271l-17-4" fill="none"/>
              <path d="M639 272h26M687 272h21" fill="none" stroke="#fffbea" stroke-width="1.5" opacity=".6"/>
            </g>

            <!-- Individually drawn waves retain the reference hairstyle instead of a generic hair cap. -->
            <path d="M615 284L608 270Q596 260 602 243Q590 228 601 211Q601 194 620 189Q617 173 642 172Q657 155 678 168Q699 158 711 179Q734 175 739 198Q757 213 743 234Q746 251 725 256Q715 268 699 258Q681 272 665 259Q648 271 634 260Q630 277 627 290L621 292Z" fill="url(#hair-fill)" stroke="#343a32" stroke-width="3"/>
            <path d="M607 237Q604 219 627 218Q613 204 630 190Q638 180 651 185" fill="none" stroke="#58564c" stroke-width="4.3"/>
            <path d="M628 240Q651 245 660 225Q663 211 650 204Q639 197 643 187" fill="none" stroke="#57564d" stroke-width="4.6"/>
            <path d="M656 180Q675 172 687 189Q701 211 683 224Q676 231 666 230" fill="none" stroke="#5e5b51" stroke-width="4.2"/>
            <path d="M697 185Q721 190 721 211Q722 226 707 231" fill="none" stroke="#53534b" stroke-width="4.5"/>

            <path d="M613 242q7 11 22 7M624 192q-5 7-3 14M657 178q11-3 18 1" fill="none" stroke="#777164" stroke-width="2.2" opacity=".65"/>
            <path d="M603 216q-2 19 11 23M632 214q-7 18 8 21M687 192q10 19-1 28" fill="none" stroke="#272e28" stroke-width="3" opacity=".6"/>
            <path d="M635 174q4-9 14-10M680 169q8-6 15-1" fill="none" stroke="#47483e" stroke-width="3"/>

        <!-- A small breeze follows the rider. -->
        <g id="breeze" fill="none" stroke="#f7fae9" stroke-width="3" stroke-linecap="round" opacity=".8">
          <path d="M361 345h67q12 0 12-9t-10-8M383 369h47M349 369h17M415 391h28"/>
        </g>
        <g fill="#729b74" stroke="#5d8866" stroke-width="2" stroke-linejoin="round">
          <path d="M44 760Q15 724 5 730Q9 750 36 760M46 760Q31 706 48 701Q65 714 50 757M53 760Q65 721 80 730Q85 746 57 760"/>

    <footer class="footer">
      <p class="caption">微风作伴，慢慢骑就好。</p>
      <button id="motion-toggle" type="button" hidden>
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path id="motion-icon" d="M4 3h3v10H4zM9 3h3v10H9z"/></svg>
        <span id="motion-label">暂停骑行</span>
      </button>
    </footer>
  </main>
  <script>
    (() => {
      'use strict';
      const byId = (id) => document.getElementById(id);
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const toggle = byId('motion-toggle');
      const parts = Object.fromEntries([
        'near-pants-outline', 'near-pants', 'near-seam', 'near-sock', 'near-shoe',
        'far-pants-outline', 'far-pants', 'far-sock', 'far-shoe',
        'near-pedal', 'far-pedal', 'crank', 'rear-spokes', 'front-spokes',
        'rider-upper', 'road-marks', 'cloud-left', 'cloud-right', 'breeze', 'eyes'
      ].map((id) => [id, byId(id)]));
      const crank = { x: 614, y: 576, radius: 28 };
      let running = !reducedMotion.matches;
      let elapsed = 0;
      let previousTime = null;
      let frameId = null;

      // Solve the knee from the fixed hip and moving ankle so each foot follows its pedal.
      function drawLeg(side, angle, hip, upperLength, lowerLength) {
        const pedal = { x: crank.x + Math.cos(angle) * crank.radius, y: crank.y + Math.sin(angle) * crank.radius };
        const ankle = { x: pedal.x - 6, y: pedal.y - 18 };
        const dx = ankle.x - hip.x;
        const dy = ankle.y - hip.y;
        const distance = Math.hypot(dx, dy);
        const along = (upperLength ** 2 - lowerLength ** 2 + distance ** 2) / (2 * distance);
        const across = Math.sqrt(Math.max(0, upperLength ** 2 - along ** 2));
        const knee = { x: hip.x + (along * dx + across * dy) / distance, y: hip.y + (along * dy - across * dx) / distance };
        const path = `M${hip.x} ${hip.y}L${knee.x.toFixed(2)} ${knee.y.toFixed(2)}L${ankle.x.toFixed(2)} ${(ankle.y - 4).toFixed(2)}`;
        parts[`${side}-pants-outline`].setAttribute('d', path);
        parts[`${side}-pants`].setAttribute('d', path);
        parts[`${side}-sock`].setAttribute('d', `M${ankle.x} ${ankle.y - 8}L${ankle.x} ${ankle.y + 2}`);
        parts[`${side}-shoe`].setAttribute('transform', `translate(${ankle.x} ${ankle.y})`);
        parts[`${side}-pedal`].setAttribute('transform', `translate(${pedal.x} ${pedal.y})`);
        if (side === 'near') {
          parts['near-seam'].setAttribute('d', `M${hip.x + 5} ${hip.y - 7}L${knee.x + 6} ${knee.y - 3}L${ankle.x + 7} ${ankle.y - 11}`);
        }
      }

      function draw() {
        const phase = elapsed * 2.65 + 0.35;
        const degrees = phase * 180 / Math.PI;
        drawLeg('far', phase + Math.PI, { x: 546, y: 449 }, 93, 100);
        drawLeg('near', phase, { x: 555, y: 449 }, 96, 103);
        parts.crank.setAttribute('transform', `rotate(${degrees} 614 576)`);
        parts['rear-spokes'].setAttribute('transform', `rotate(${degrees * 1.65})`);
        parts['front-spokes'].setAttribute('transform', `rotate(${degrees * 1.65})`);
        parts['road-marks'].setAttribute('patternTransform', `translate(${-(elapsed * 100) % 220} 0)`);
        parts['rider-upper'].setAttribute('transform', `translate(0 ${Math.sin(phase * 2) * 0.8})`);
        parts['cloud-left'].setAttribute('transform', `translate(${Math.sin(elapsed / 14) * 17} 0)`);
        parts['cloud-right'].setAttribute('transform', `translate(${Math.sin(elapsed / 18) * -12} 0)`);
        parts.breeze.setAttribute('opacity', String(.55 + Math.sin(elapsed * 2) * .2));
        const blink = elapsed % 5.8;
        parts.eyes.setAttribute('transform', blink > 5.55 && blink < 5.7 ? 'translate(0 251) scale(1 .1)' : '');
      }

      function tick(timestamp) {
        frameId = null;
        if (!running || document.hidden) return;
        if (previousTime !== null) elapsed += Math.min((timestamp - previousTime) / 1000, .05);
        previousTime = timestamp;
        draw();
        frameId = requestAnimationFrame(tick);
      }

      function syncMotion() {
        if (frameId !== null) cancelAnimationFrame(frameId);
        frameId = null;
        previousTime = null;
        byId('motion-label').textContent = running ? '暂停骑行' : '继续骑行';
        byId('motion-icon').setAttribute('d', running ? 'M4 3h3v10H4zM9 3h3v10H9z' : 'M4 2.5v11L13 8z');
        if (running && !document.hidden) frameId = requestAnimationFrame(tick);
      }

      toggle.addEventListener('click', () => { running = !running; syncMotion(); });
      document.addEventListener('visibilitychange', syncMotion);
      reducedMotion.addEventListener('change', (event) => { running = !event.matches; syncMotion(); });
      draw();
      toggle.hidden = false;
      syncMotion();
    })();
  </script>
</body>
